# CodeSchema CI Pipeline
# 构建、测试、代码检查 — 推送/PR 时自动运行

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 每日夜间全量规模压测（10万+ 文件端到端），产出趋势 JSONL 供跨提交对比
  schedule:
    - cron: '0 20 * * *'

# 允许 Windows 步骤经 GITHUB_TOKEN 写入 commit status（暴露失败测试名供匿名读取）
permissions:
  contents: read
  statuses: write

env:
  GO_VERSION: '1.25'

jobs:
  # === 构建与测试 ===
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v ./cmd/codeschema

      - name: Vet
        run: go vet ./...

      - name: Test (non-Windows)
        if: runner.os != 'Windows'
        run: go test -count=1 -timeout 180s ./...

      # Windows 专用：详细输出 + 失败测试名写入 commit status（匿名远程可读，无需登录）
      # tee 双写日志到 artifact；同时提取 '--- FAIL:' 测试名经 GITHUB_TOKEN 写入
      # commit status(context=win-test-failures)，远端无 token 即可读取定位失败点。
      - name: Test (Windows verbose)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          go test -count=1 -timeout 600s -v ./... 2>&1 | tee windows-test.log
          code=${PIPESTATUS[0]}
          echo "test exit code: $code"
          FAILS=$(grep -E '^--- FAIL:' windows-test.log | sed 's/^--- FAIL: //' | cut -c1-120 | tr '\n' ';')
          if [ -n "$FAILS" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -d "{\"state\":\"failure\",\"description\":\"WINFAIL: $FAILS\",\"context\":\"win-test-failures\"}" || true
          fi
          exit $code

      - name: Upload Windows test log
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-log-${{ github.run_id }}
          path: windows-test.log
          if-no-files-found: warn

      # 看护：确认已跟踪的基准快照未被测试误改（默认写临时目录，仅 CODESCHEMA_UPDATE_BENCH=1 才写回 build/）
      - name: Assert tracked bench snapshots unchanged
        if: runner.os != 'Windows'
        run: git diff --exit-code -- build/bench-compare.json build/realrepo-bench.json build/agent-task-bench/agent-task-bench.json build/agent-task-bench/agent-task-bench.md

  # === Agent 任务端到端评测（对外可信基准回归看护） ===
  agent-bench:
    name: Agent Task Bench
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Agent task bench (real repo, snapshot guard)
        # 真实仓库评测（TestRun_RealRepo）：验证通过率梯度（full>=minimal>=none）与
        # token 节省（minimal<full）；快照归一化（repo_path=仓库名）保证 CI 上
        # git diff --exit-code 不受本机路径差异影响。
        run: go test -count=1 -timeout 300s -run '^TestRun_RealRepo$' ./internal/agentbench/

      - name: Assert agent-bench snapshot unchanged
        run: git diff --exit-code -- build/agent-task-bench/agent-task-bench.json build/agent-task-bench/agent-task-bench.md

  # === 规模基准（BulkUpsert 回归看护） ===
  bench:
    name: Scale Benchmark
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Scale benchmark (BulkUpsert regression guard)
        # -run '^$' 仅跑基准，避免触发同包内超慢的 TestScaleBench（100k 逐文件 UpsertIR，分钟级）
        # BenchmarkScaleBulkConcurrent：并发写回归看护（多 worker 并发 BulkUpsert），配合 -race 检测数据竞争
        # BenchmarkSQLiteWALConfigs：WAL 同步参数定案看护（NORMAL/FULL/OFF 单事务耗时相当，默认 NORMAL 最优）
        run: go test -race -run '^$' -bench='BenchmarkScaleBulk|BenchmarkSQLiteWALConfigs' -benchmem -count=1 -timeout 600s ./internal/scalebench/...

  # === 夜间全量规模压测（T3-4：10万+ 文件端到端全链路 + 趋势归档） ===
  nightly-scale:
    name: Nightly Scale E2E (100k)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    # 写回 build/scale-e2e.json 供归档（默认测试写临时目录，此处需显式开启）
    env:
      CODESCHEMA_UPDATE_BENCH: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Scale E2E benchmark (N=100000)
        # 真实文件→Scanner→UpsertIR→BuildFromStore→Searcher 全链路，产出 build/scale-e2e.json
        run: CODESCHEMA_SCALE_E2E_N=100000 go test -count=1 -run '^TestScaleEndToEnd$' -v -timeout 1800s ./internal/scalebench/

      - name: Append e2e trend (JSONL)
        # 每次夜间运行把结果快照（含 git SHA）追加为 JSONL，跨提交对比扫描/索引/内存漂移
        run: |
          mkdir -p build
          if [ -f build/scale-e2e.json ]; then
            echo "{\"sha\":\"${{ github.sha }}\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"data\":$(cat build/scale-e2e.json)}" >> build/scale-e2e-history.jsonl
          fi

      - name: Upload scale e2e artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scale-e2e-${{ github.sha }}
          path: |
            build/scale-e2e.json
            build/scale-e2e-history.jsonl
          if-no-files-found: warn

  # === 竞态检测（仅 Linux） ===
  race:
    name: Race Detector
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with race detector
        run: go test -race -count=1 -timeout 300s ./...

  # === 真语法树路径（-tags treesitter，需 gcc） ===
  treesitter:
    name: TreeSitter AST (CGO)
    runs-on: ubuntu-latest
    needs: [test]
    # 写回 build/treesitter-callgraph-bench.json 供归档（默认测试写临时目录，此处需显式开启）
    env:
      CODESCHEMA_UPDATE_BENCH: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # 真语法树路径守护：构建 + AST 适配器测试 + 调用图基准（复杂档需精确解析）
      - name: Build with -tags treesitter
        run: go build -tags treesitter ./...

      - name: Vet with -tags treesitter
        run: go vet -tags treesitter ./internal/parser/adapter/treesitter/...

      - name: Test with -tags treesitter
        run: go test -tags treesitter -count=1 -timeout 300s ./internal/parser/adapter/treesitter/... ./internal/adapterbench/...

      # 默认路径（正则，免 CGO）不回归
      - name: Test default (regex) path
        run: go test -count=1 -timeout 120s ./internal/parser/adapter/treesitter/... ./internal/adapterbench/...

      # 归档调用图基准产物（JSON 明细 + JSONL 历史），跨提交对比精度漂移
      - name: Upload callgraph bench artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: treesitter-bench-${{ github.sha }}
          path: |
            build/treesitter-callgraph-bench.json
            build/treesitter-bench-history.jsonl
          if-no-files-found: warn

  # === 交叉编译（无 CGO） ===
  cross:
    name: Cross-Compile
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout idcu-go modules
        # CodeSchema 依赖的三个 idcu-go 公共模块：go.mod 用 replace 指向仓库外的 ../idcu-go/*，
        # 便于本地改模块即时生效；CI 上必须把它们取到同级目录，replace 才能解析。
        # 三个模块已发布到 gitee.com/idcu-go/*（v0.1.0），这里按 tag 拉取固定版本。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../idcu-go
          for m in trim ttlcache pathsafe; do
            if [ ! -d "../idcu-go/${m}/.git" ]; then
              git clone --depth 1 --branch v0.1.0 "https://gitee.com/idcu-go/${m}.git" "../idcu-go/${m}"
            fi
          done

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile
        run: |
          make cross

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeschema-binaries
          path: build/codeschema-*

  # === Docker 镜像（仅 tag 推送） ===
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: codeschema
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and export
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}