# CodeSchema CI Pipeline
# 构建、测试、代码检查 — 推送/PR 时自动运行

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 每日夜间全量规模压测（10万+ 文件端到端），产出趋势 JSONL 供跨提交对比
  schedule:
    - cron: '0 20 * * *'

env:
  GO_VERSION: '1.25'

jobs:
  # === 构建与测试 ===
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build -v ./cmd/codeschema

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 120s ./...

  # === 规模基准（BulkUpsert 回归看护） ===
  bench:
    name: Scale Benchmark
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Scale benchmark (BulkUpsert regression guard)
        # -run '^$' 仅跑基准，避免触发同包内超慢的 TestScaleBench（100k 逐文件 UpsertIR，分钟级）
        run: go test -run '^$' -bench=BenchmarkScaleBulk -benchmem -count=1 -timeout 300s ./internal/scalebench/...

  # === 夜间全量规模压测（T3-4：10万+ 文件端到端全链路 + 趋势归档） ===
  nightly-scale:
    name: Nightly Scale E2E (100k)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Scale E2E benchmark (N=100000)
        # 真实文件→Scanner→UpsertIR→BuildFromStore→Searcher 全链路，产出 build/scale-e2e.json
        run: CODESCHEMA_SCALE_E2E_N=100000 go test -count=1 -run '^TestScaleEndToEnd$' -v -timeout 1800s ./internal/scalebench/

      - name: Append e2e trend (JSONL)
        # 每次夜间运行把结果快照（含 git SHA）追加为 JSONL，跨提交对比扫描/索引/内存漂移
        run: |
          mkdir -p build
          if [ -f build/scale-e2e.json ]; then
            echo "{\"sha\":\"${{ github.sha }}\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"data\":$(cat build/scale-e2e.json)}" >> build/scale-e2e-history.jsonl
          fi

      - name: Upload scale e2e artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scale-e2e-${{ github.sha }}
          path: |
            build/scale-e2e.json
            build/scale-e2e-history.jsonl
          if-no-files-found: warn

  # === 竞态检测（仅 Linux） ===
  race:
    name: Race Detector
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test with race detector
        run: go test -race -count=1 -timeout 180s ./...

  # === 真语法树路径（-tags treesitter，需 gcc） ===
  treesitter:
    name: TreeSitter AST (CGO)
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-gotreesitter-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gotreesitter-

      # 真语法树路径守护：构建 + AST 适配器测试 + 调用图基准（复杂档需精确解析）
      - name: Build with -tags treesitter
        run: go build -tags treesitter ./...

      - name: Vet with -tags treesitter
        run: go vet -tags treesitter ./internal/parser/adapter/treesitter/...

      - name: Test with -tags treesitter
        run: go test -tags treesitter -count=1 -timeout 300s ./internal/parser/adapter/treesitter/... ./internal/adapterbench/...

      # 默认路径（正则，免 CGO）不回归
      - name: Test default (regex) path
        run: go test -count=1 -timeout 120s ./internal/parser/adapter/treesitter/... ./internal/adapterbench/...

      # 归档调用图基准产物（JSON 明细 + JSONL 历史），跨提交对比精度漂移
      - name: Upload callgraph bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: treesitter-bench-${{ github.sha }}
          path: |
            build/treesitter-callgraph-bench.json
            build/treesitter-bench-history.jsonl
          if-no-files-found: warn

  # === 交叉编译（无 CGO） ===
  cross:
    name: Cross-Compile
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cross-compile
        run: |
          make cross

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeschema-binaries
          path: build/codeschema-*

  # === Docker 镜像（仅 tag 推送） ===
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codeschema
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}