# ---------------------------------------------------------------------------
# 生产安全基线示例（对外监听收敛）
#
# 用途：作为「对外监听收敛」合规项的参考配置（安全设计文档 §7）。
# 与默认行为差异：默认 mcp_addr=:8080 / http_addr=:8081 为全接口绑定；
# 本示例将监听收敛到 127.0.0.1（仅本机可连），并显式开启认证与全局限流。
#
# 三种暴露形态按需选择：
#   1) 仅本机访问            → 127.0.0.1:<port>（本示例）
#   2) 内网访问（推荐）      → 经 Nginx 内网反代，仅放行内网网段
#   3) 对外公网暴露（谨慎）  → 必须开启 auth_token + rate_limit + TLS（Nginx 终止）
# ---------------------------------------------------------------------------
server:
  # 监听收敛：仅绑定本机回环地址（默认 :8080/:8081 为全接口绑定）
  mcp_addr: "127.0.0.1:8080"
  http_addr: "127.0.0.1:8081"
  # 生产必须设置：MCP/HTTP Bearer 认证令牌（空串 = 不认证）
  auth_token: "change-me-strong-secret"
  # 全局限流：每分钟请求上限（令牌桶，突发=上限）。0 = 不限流
  rate_limit: 600

# 若需经 Nginx 内网反代对外暴露，server.mcp_addr/http_addr 保持 127.0.0.1 即可，
# 由 Nginx 代理至对应端口；示例：
#   server {
#     listen 8081 ssl;
#     location / { proxy_pass http://127.0.0.1:8081; }
#   }
