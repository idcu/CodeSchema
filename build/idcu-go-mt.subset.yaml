server:
  http_addr: ":18081"
  mcp_addr: ":18080"
project:
  name: "idcu-go"
  root: /Volumes/Data/idcu-go
tenants:
  - id: trim
    name: "trim"
    root: /Volumes/Data/idcu-go/trim
    storage:
      driver: sqlite
      dsn: /tmp/idcu-subset/trim
    auto_scan: true
    watch: false
  - id: ttlcache
    name: "ttlcache"
    root: /Volumes/Data/idcu-go/ttlcache
    storage:
      driver: sqlite
      dsn: /tmp/idcu-subset/ttlcache
    auto_scan: true
    watch: false
  - id: pathsafe
    name: "pathsafe"
    root: /Volumes/Data/idcu-go/pathsafe
    storage:
      driver: sqlite
      dsn: /tmp/idcu-subset/pathsafe
    auto_scan: true
    watch: false
